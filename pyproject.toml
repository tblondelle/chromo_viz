[project]
name = "chromoviz"
version = "0.1.0"
description = "Display chromosoms in a block way from simple user input."
readme = "README.md"
authors = [
    { name = "Thomas", email = "thomas.blondelle@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
]

[project.scripts]
chromoviz = "chromoviz:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
